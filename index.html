<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog</title>
<style>
  /* ستايل الموقع وكيف كل زر شكله او الايرورات */
  :root { --ink:#0d1b2a; --snow:#e8eff6; --ice:#9fc3dd; --flame:#ff9b3d; --err:#ff8f8f; }
  * { box-sizing: border-box; }
  html { background: #08131f; }
  body { font-family: Georgia, serif; color: var(--snow); line-height: 1.6;
         margin: 0; padding: 0; min-height: 100vh; }

  /* Layers use POSITIVE z-index. A negative one paints behind the root
     background and becomes invisible — which is exactly what happened before. */
  /* Crisp, not blurred: the pixel grid is the point. */
  .bg  { position: fixed; inset: 0; z-index: 0; }
  .bg svg { width: 100%; height: 100%; display: block; }
  /* A flat wash only where text sits, so the middle of the scene stays visible. */
  .veil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
          background: radial-gradient(ellipse 78% 62% at 50% 42%,
            rgba(6,15,25,.66) 0%, rgba(6,15,25,.48) 55%, rgba(6,15,25,.06) 100%); }
  .fire { position: fixed; bottom: -6px; z-index: 2; pointer-events: none;
          width: clamp(190px, 20vw, 330px); }
  @media (max-width: 700px) { .fire { width: clamp(130px, 34vw, 190px); } }
  .fire svg { width: 100%; display: block; }
  .fire.left  { left: -2.2vw; }
  .fire.right { right: -2.2vw; }

  .wrap { position: relative; z-index: 3; max-width: 640px; margin: 0 auto;
          padding: 40px 16px 96px; }

  header { border-bottom: 2px solid rgba(232,239,246,.85); padding-bottom: 8px; margin-bottom: 24px;
           display: flex; justify-content: space-between; align-items: baseline; }
  h1 { margin: 0; font-size: 26px; }
  h1 a { color: var(--snow); text-decoration: none; }
  nav a { font-size: 13px; color: var(--ice); text-decoration: none; }
  nav a:hover { color: #fff; }
  h2, h3 { color: var(--snow); }
  a { color: var(--ice); }
  article { border-bottom: 1px solid rgba(159,195,221,.32); padding: 14px 0; }
  article h3 { margin: 0 0 4px; font-size: 19px; }
  article h3 a { color: var(--snow); text-decoration: none; }
  article h3 a:hover { color: var(--flame); }
  article p { color: rgba(232,239,246,.92); }
  .meta { color: rgba(200,220,235,.6); font-size: 12px; margin-bottom: 6px; }
  .meta code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
               background: rgba(159,195,221,.14); padding: 1px 4px; }
  img { max-width: 100%; border: 1px solid rgba(159,195,221,.35); margin: 8px 0; display: block; }
  input, textarea, button { width: 100%; font: inherit; padding: 8px; margin-bottom: 8px; }
  input, textarea { background: rgba(8,19,31,.78); color: var(--snow);
                    border: 1px solid rgba(159,195,221,.42); }
  input::placeholder, textarea::placeholder { color: rgba(200,220,235,.45); }
  textarea { min-height: 130px; }
  button { background: #16334d; color: var(--snow);
           border: 1px solid rgba(159,195,221,.5); cursor: pointer; }
  button:hover:not(:disabled) { background: #1d4262; }
  button.small { width: auto; padding: 3px 10px; font-size: 12px; }
  button.red  { background: #5c1a1a; border-color: rgba(255,143,143,.5); }
  button.fire { background: #4a2410; border-color: rgba(255,155,61,.6); }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: var(--err); font-size: 13px; }
  .muted { color: rgba(200,220,235,.6); font-size: 13px; font-style: italic; }
  .row { border-bottom: 1px solid rgba(159,195,221,.2); padding: 10px 0; font-size: 14px; }
  .banner { background: rgba(92,26,26,.55); border: 1px solid rgba(255,143,143,.5);
            padding: 8px 12px; margin-bottom: 18px; font-size: 13px; color: #ffd9d9; }
  .banner b { color: #fff; }

  .cmt { border-top: 1px solid rgba(159,195,221,.2); padding: 10px 0; font-size: 14px; }
  .cmt .who { color: var(--snow); font-weight: 600; font-size: 13px; }
  .cmt .who.anon { color: rgba(200,220,235,.72); font-weight: 400;
                   font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .cmt .when { color: rgba(200,220,235,.5); font-size: 11px; }
  .cmt p { margin: 4px 0 0; color: rgba(232,239,246,.9); }
  .cmt-head { margin-top: 30px; padding-top: 6px; border-top: 2px solid rgba(232,239,246,.5); }

  /* Frame-by-frame flame. Each frame owns one quarter of the cycle.
     Delays are set per-frame with nth-child, never on the group — setting
     animation-delay on `.frames g` would overwrite all four and they would
     flash in unison, which is what made the fire look like it was blinking. */
  .frames g { opacity: 0; animation: showFrame 3.6s steps(1) infinite; }
  .frames g:nth-child(1) { animation-delay: 0s;    }
  .frames g:nth-child(2) { animation-delay: -2.7s; }
  .frames g:nth-child(3) { animation-delay: -1.8s; }
  .frames g:nth-child(4) { animation-delay: -0.9s; }
  @keyframes showFrame {
    0%, 24.9% { opacity: 1; }
    25%, 100% { opacity: 0; }
  }
  /* the right fire runs a little slower, so the pair never sync up */
  .fire.right .frames g { animation-duration: 4.1s; }

  /* A gentle breathing glow, not a strobe. */
  .glow { animation: pulse 4.2s ease-in-out infinite; }
  .fire.right .glow { animation-delay: 1.4s; }
  @keyframes pulse { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }

  /* Embers: sparse, slow, fading out well before they travel far. */
  .ember { animation-name: rise; animation-timing-function: ease-out;
           animation-iteration-count: infinite; opacity: 0; }
  @keyframes rise {
    0%   { transform: translate(0, 0);        opacity: 0;   }
    20%  { opacity: .75; }
    70%  { transform: translate(-5px, -40px); opacity: .3;  }
    100% { transform: translate(6px, -76px);  opacity: 0;   }
  }
  .fire.right .ember { animation-name: rise-r; }
  @keyframes rise-r {
    0%   { transform: translate(0, 0);       opacity: 0;   }
    20%  { opacity: .75; }
    70%  { transform: translate(5px, -40px); opacity: .3;  }
    100% { transform: translate(-6px, -76px); opacity: 0;  }
  }

  /* Smoke: grey blocks that climb, widen slightly and dissolve. */
  .puff { animation-name: smokeUp; animation-timing-function: linear;
          animation-iteration-count: infinite; opacity: 0; }
  @keyframes smokeUp {
    0%   { transform: translate(0, 0) scale(1);        opacity: 0;   }
    20%  { opacity: .4; }
    60%  { transform: translate(calc(var(--drift, 6px) * 0.5), -58px) scale(1.5); opacity: .26; }
    100% { transform: translate(var(--drift, 6px), -124px) scale(2.0); opacity: 0;  }
  }

  @media (prefers-reduced-motion: reduce) {
    .frames g { animation: none; }
    .frames .f0 { opacity: 1; }
    .glow, .ember, .puff { animation: none; }
    .ember { opacity: .45; }
    .puff { opacity: .3; }
  }
</style>
</head>

<div class="wrap">
<header>
  <h1><a href="#/">My Blog</a></h1>
  <nav><a href="#/new">+ New post</a> &nbsp; <a href="#/admin">Admin</a></nav>
</header>

<div id="app"></div>
</div>

<script>
const app = document.getElementById("app");
const $ = (id) => document.getElementById(id);

// ── permanent device id ──────────────────────────────────────
// Stored in TWO places, because each survives a different kind of clearing:
// localStorage survives tab close; the cookie survives "clear localStorage".
// On load either one restores the other. Honest limit: "clear all site data"
// wipes both, and another browser or private mode starts fresh.
const DEV = "blog-device";
const COOKIE = "blog-device";
const TEN_YEARS = 60 * 60 * 24 * 365 * 10;

function readCookie() {
  const m = document.cookie.match(/(?:^|;\s*)blog-device=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

function writeCookie(v) {
  document.cookie = COOKIE + "=" + encodeURIComponent(v) +
    "; path=/; max-age=" + TEN_YEARS + "; SameSite=Lax";
}

function device() {
  let id = null;
  try { id = localStorage.getItem(DEV); } catch { }
  if (!id) id = readCookie();

  if (!id) {
    id = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  // keep both copies in sync
  try { localStorage.setItem(DEV, id); } catch { }
  writeCookie(id);
  return id;
}

const dev = device();                       // fixed for the life of the page
const devShort = () => dev.slice(0, 6);     // what strangers see
const anonName = () => "user " + devShort();

// ── chosen name ──────────────────────────────────────────────
// Optional. If absent, the server stores "" and the UI derives "user <id>",
// so the display name can never drift away from the device it belongs to.
const NAME = "blog-name";
const myName = () => { try { return localStorage.getItem(NAME) || ""; } catch { return ""; } };
const setName = (v) => { try { localStorage.setItem(NAME, v.slice(0, 60)); } catch { } };

const anonNameOf = (deviceId) => "user " + String(deviceId || "").slice(0, 6);

// The admin password, kept for this tab only.
// عشان الادمن كي يروح مع تقفيلتك للموقع
const key = {
  get: () => sessionStorage.getItem("admin-key") || "",
  set: (v) => sessionStorage.setItem("admin-key", v),
  clear: () => sessionStorage.removeItem("admin-key")
};

// عشان لو صارلك محاولة اختراق الكلام يتغير وما يتنفذ بالداتا بيس XSS
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const day = (d) => new Date(d).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
const when = (d) => new Date(d).toLocaleString("en-US", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

// يشيك الباسوورد لو صح يوديه الهيدر
async function call(url, opts = {}) {
  const headers = {};
  if (opts.admin) headers["x-admin-key"] = key.get();
  if (opts.body) headers["Content-Type"] = "application/json";
  const res = await fetch(url, { ...opts, headers });
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error(body?.error || "HTTP " + res.status);
  return body;
}

// ── views ──
async function list() {
  const posts = await call("/api/posts");
  if (!posts.length) return (app.innerHTML = '<p class="muted">No posts yet.</p>');
  app.innerHTML = posts.map((p) => `
    <article>
      <h3><a href="#/post/${esc(p.id)}">${esc(p.title)}</a></h3>
      <div class="meta">${day(p.createdAt)}</div>
      ${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="">` : ""}
      <p>${esc(p.body.slice(0, 130))}${p.body.length > 130 ? "..." : ""}</p>
    </article>`).join("");
}

// عشان يوريك البوست لحاله
async function one(id) {
  const [posts, cm] = await Promise.all([
    call("/api/posts"),
    call("/api/comments/" + encodeURIComponent(id))
  ]);
  const p = posts.find((x) => x.id === id);
  if (!p) return (app.innerHTML = '<p class="muted">Not found. <a href="#/">Back</a></p>');

  const comments = cm.comments || [];
  const paused = cm.paused;
  const chosen = myName();

  app.innerHTML = `
    <article><h3 style="font-size:24px">${esc(p.title)}</h3>
      <div class="meta">${day(p.createdAt)}</div>
      ${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="">` : ""}
      <p>${esc(p.body)}</p></article>

    <p><a href="#/">&larr; Back</a></p>

    <div class="cmt-head">
      <h3>Comments (${comments.length})</h3>
      ${comments.map((c) => {
        const named = c.name && c.name.trim();
        return `<div class="cmt">
          <span class="who${named ? "" : " anon"}">${esc(named || anonNameOf(c.deviceId))}</span>
          <span class="when"> &middot; ${when(c.createdAt)}</span>
          <p>${esc(c.body)}</p>
        </div>`;
      }).join("") || '<p class="muted">No comments yet.</p>'}
    </div>

    ${paused
      ? '<p class="banner"><b>Posting paused.</b> Comments are closed for now.</p>'
      : `<form id="cf">
           <h3>Add a comment</h3>
           <p class="muted">You are <code>${esc(chosen || anonName())}</code>. Pick a name or leave it blank to stay <code>${esc(anonName())}</code>.</p>
           <input id="cname" placeholder="Your name (optional)" maxlength="60" value="${esc(chosen)}">
           <input id="cbody" placeholder="Write a comment..." maxlength="600" required>
           <button type="submit">Post comment</button>
           <p class="err" id="ce"></p>
         </form>`}`;

  const f = $("cf");
  if (!f) return;
  f.onsubmit = async (e) => {
    e.preventDefault();
    $("ce").textContent = "";
    try {
      setName($("cname").value.trim());
      await call("/api/comments", { method: "POST", body: JSON.stringify({
        postId: id,
        name: $("cname").value,
        body: $("cbody").value,
        deviceId: dev
      })});
      one(id);
    } catch (err) {
      $("ce").textContent = err.message;
    }
  };
}

// يعطيك الفورم حق انك تسوي بوست
async function compose() {
  const st = await call("/api/modstate");
  if (st.paused) {
    app.innerHTML = `<h2>New post</h2>
      <p class="banner"><b>Posting paused.</b> ${esc(st.reason || "The moderator has paused new posts.")}
      ${st.since ? " Since " + day(st.since) + "." : ""}</p>
      <p><a href="#/">&larr; Back to posts</a></p>`;
    return;
  }

  app.innerHTML = `
    <h2>New post</h2>
    <form id="f">
      <input id="title" placeholder="Title" required maxlength="140">
      <textarea id="body" placeholder="Write something..." required></textarea>
      <input id="pic" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
      <button type="submit">Publish</button>
    </form>
    <p class="err" id="e"></p>`;

  $("f").onsubmit = async (e) => {
    e.preventDefault();
    $("e").textContent = "";
    try {
      let imageUrl = null;
      const f = $("pic").files[0];

      if (f) {
        const data = await new Promise((ok) => {
          const r = new FileReader();
          r.onload = () => ok(String(r.result).split(",")[1]);
          r.readAsDataURL(f);
        });
        imageUrl = (await call("/api/upload",
          { method: "POST", body: JSON.stringify({ filename: f.name, contentType: f.type, data, deviceId: dev }) })).url;
      }

      await call("/api/posts", {
        method: "POST",
        body: JSON.stringify({ title: $("title").value, body: $("body").value, imageUrl, deviceId: dev })
      });
      location.hash = "#/";
    } catch (err) {
      $("e").textContent = err.message;
    }
  };
}

// يشيك لو كان الكي حقك نفس حق الادمن من الداتا بيس لو كان يعطيك صلاحية البان والحذف
async function admin(err = "") {
  if (!key.get()) {
    app.innerHTML = `
      <h2>Admin</h2>
      <p class="muted">Enter the admin password.</p>
      <form id="f"><input id="pw" type="password" placeholder="Admin password" required>
      <button type="submit">Sign in</button></form>
      <p class="err">${esc(err)}</p>`;
    $("f").onsubmit = (e) => {
      e.preventDefault();
      key.set($("pw").value);
      admin();
    };
    return;
  }

  let posts, bans, posting;
  try {
    const [p, m] = await Promise.all([
      call("/api/posts", { admin: true }),
      call("/api/mod", { admin: true })
    ]);
    posts = p;
    bans = m.bans || [];
    posting = m.posting || { paused: false };
  } catch (e) {
    key.clear();
    return admin(e.message);   // back to the form, with the reason shown
  }

  // يدل الاي بي اي على اسم الجهاز المبلك
  const blocked = new Set(bans.map((b) => b.bannedDevice));

  //واجهة الادمن
  app.innerHTML = `
    <h2>Admin</h2>
    <p class="err" id="e"></p>

    <h3>Posting</h3>
    <div class="row">
      ${posting.paused
        ? `<span class="meta">PAUSED${posting.reason ? " &middot; " + esc(posting.reason) : ""}
             ${posting.since ? " &middot; since " + when(posting.since) : ""}</span><br>
           <button class="small" data-resume="1">Resume posting</button>`
        : `<span class="meta">OPEN &mdash; anyone can post</span><br>
           <button class="small fire" data-pause="1">Pause posting</button>`}
    </div>

    <h3>Posts (${posts.length})</h3>
    ${posts.map((p) => `
      <div class="row">
        <strong>${esc(p.title)}</strong><br>
        <span class="meta">${esc(p.ip)} &middot; ${day(p.createdAt)}
          &middot; <code>${esc(String(p.deviceId || "").slice(0, 6))}</code>
          ${blocked.has(p.deviceId) ? " &middot; BLOCKED" : ""}</span><br>
        <button class="small red" data-del="${esc(p.id)}">Delete</button>
        ${blocked.has(p.deviceId) ? "" : `<button class="small red" data-block="${esc(p.deviceId)}" data-ip="${esc(p.ip)}">Block device</button>`}
      </div>`).join("") || '<p class="muted">No posts.</p>'}

    <h3>Blocked (${bans.length})</h3>
    ${bans.map((b) => `
      <div class="row">
        <span class="meta"><code>${esc(String(b.bannedDevice || "").slice(0, 6))}</code>
          &middot; ${esc(b.ip)} &middot; ${day(b.bannedAt)}
          ${b.reason ? " &middot; " + esc(b.reason) : ""}</span><br>
        <button class="small" data-unblock="${esc(b.bannedDevice)}">Unblock</button>
      </div>`).join("") || '<p class="muted">Nobody blocked.</p>'}
    <p><button class="small" id="out">Sign out</button></p>`;

  $("out").onclick = () => {
    key.clear(); // يشيل الكي من الهيدر
    admin();
  };

  app.onclick = async (e) => {
    const b = e.target.closest("button[data-del],button[data-block],button[data-unblock],button[data-pause],button[data-resume]");
    if (!b) return;
    b.disabled = true;
    $("e").textContent = "";
    try {
      if (b.dataset.del) {
        await call("/api/posts/" + encodeURIComponent(b.dataset.del), { method: "DELETE", admin: true });
      } else if (b.dataset.pause) {
        const r = prompt("Reason for pausing (optional):", "");
        if (r === null) return (b.disabled = false);
        await call("/api/mod", { method: "POST", admin: true,
          body: JSON.stringify({ action: "pause", reason: r }) });
      } else if (b.dataset.resume) {
        await call("/api/mod", { method: "POST", admin: true,
          body: JSON.stringify({ action: "resume" }) });
      } else if (b.dataset.block) {
        const reason = prompt("Reason (optional):", "");
        if (reason === null) return (b.disabled = false);
        await call("/api/mod", { method: "POST", admin: true,
          body: JSON.stringify({ action: "block", deviceId: b.dataset.block, ip: b.dataset.ip, reason }) });
      } else {
        await call("/api/mod", { method: "POST", admin: true,
          body: JSON.stringify({ action: "unblock", deviceId: b.dataset.unblock }) });
      }
      admin();
    } catch (err) {
      $("e").textContent = err.message;
      b.disabled = false;
    }
  };
}

// ── router ──
//عشان يعرف الموقع فين يوديك لاي واجهة
const route = () => {
  const h = location.hash;
  const view = h.startsWith("#/post/") ? () => one(h.slice(7))
             : h === "#/new" ? compose
             : h === "#/admin" ? admin
             : list;
  view().catch((e) => (app.innerHTML = `<p class="err">${esc(e.message)}</p>`));
};

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
