<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Georgia, serif; color: #222; line-height: 1.6;
         max-width: 640px; margin: 40px auto; padding: 0 16px; }
  header { border-bottom: 2px solid #222; padding-bottom: 8px; margin-bottom: 24px;
           display: flex; justify-content: space-between; align-items: baseline; }
  header h1 { margin: 0; font-size: 26px; }
  header h1 a { color: #222; text-decoration: none; }
  header nav a { font-size: 13px; color: #1558a8; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  article { border-bottom: 1px solid #ddd; padding: 14px 0; }
  article h3 { margin: 0 0 4px; font-size: 19px; }
  article h3 a { color: #222; }
  .meta { color: #888; font-size: 12px; margin-bottom: 6px; }
  .meta code { background: #f4f2ec; padding: 1px 4px; font-size: 11px; }
  img.thumb { max-width: 100%; border: 1px solid #ddd; margin: 8px 0; display: block; }
  input, textarea, button { width: 100%; font: inherit; padding: 8px; margin-bottom: 8px; }
  textarea { min-height: 130px; }
  button { background: #222; color: #fff; border: 0; cursor: pointer; }
  button:disabled { background: #999; }
  button.small { width: auto; padding: 3px 10px; font-size: 12px; }
  button.danger { background: #b00020; }
  .err { color: #b00020; font-size: 13px; }
  .ok  { color: #1a7f37; font-size: 13px; }
  .muted { color: #888; font-size: 13px; font-style: italic; }
  .row { border-bottom: 1px solid #eee; padding: 10px 0; }
  .row h3 { margin: 0 0 3px; font-size: 16px; }
  .tag { background: #b00020; color: #fff; font-size: 10px; padding: 1px 5px; }
</style>
</head>
<body>

<header>
  <h1><a href="#/">My Blog</a></h1>
  <nav><a href="#/new">+ New post</a> &nbsp; <a href="#/admin">Admin</a></nav>
</header>

<div id="app">Loading...</div>

<script>
// ─────────── device identity (no login) ───────────
const DEVICE_KEY = "blog-device-id";

function deviceId() {
  let id = localStorage.getItem(DEVICE_KEY);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID()
        : Date.now() + "-" + Math.random().toString(16).slice(2));
    localStorage.setItem(DEVICE_KEY, id);
  }
  return id;
}

// ─────────── admin key (held for this browser tab only) ───────────
const keyStore = {
  get: () => sessionStorage.getItem("admin-key") || "",
  set: (v) => sessionStorage.setItem("admin-key", v),
  clear: () => sessionStorage.removeItem("admin-key")
};

const app = document.getElementById("app");

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const fmt = (d) => new Date(d).toLocaleDateString("en-US",
  { month: "long", day: "numeric", year: "numeric" });

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({}, opts.headers);
  if (opts.admin) headers["x-admin-key"] = keyStore.get();
  if (opts.body) headers["Content-Type"] = "application/json";

  const res = await fetch(path, Object.assign({}, opts, { headers }));
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (e) {}
  if (!res.ok) throw new Error((body && body.error) || "HTTP " + res.status);
  return body;
}

// ─────────── list ───────────
async function listView() {
  let posts;
  try { posts = await api("/api/posts"); }
  catch (e) { app.innerHTML = '<p class="err">' + esc(e.message) + "</p>"; return; }

  if (!posts.length) {
    app.innerHTML = '<p class="muted">No posts yet. <a href="#/new">Write the first one.</a></p>';
    return;
  }
  app.innerHTML = posts.map(function (p) {
    return '<article>' +
      '<h3><a href="#/post/' + esc(p.id) + '">' + esc(p.title) + "</a></h3>" +
      '<div class="meta">' + fmt(p.createdAt) + "</div>" +
      (p.imageUrl ? '<img class="thumb" src="' + esc(p.imageUrl) + '" alt="">' : "") +
      "<p>" + esc(p.body.length > 130 ? p.body.slice(0, 130) + "..." : p.body) + "</p>" +
      "</article>";
  }).join("");
}

// ─────────── single post ───────────
async function postView(id) {
  let posts;
  try { posts = await api("/api/posts"); }
  catch (e) { app.innerHTML = '<p class="err">' + esc(e.message) + "</p>"; return; }

  const p = posts.filter(function (x) { return x.id === id; })[0];
  if (!p) { app.innerHTML = '<p class="muted">Post not found. <a href="#/">Back</a></p>'; return; }

  app.innerHTML =
    '<article style="border:0">' +
      '<h3 style="font-size:24px">' + esc(p.title) + "</h3>" +
      '<div class="meta">' + fmt(p.createdAt) + "</div>" +
      (p.imageUrl ? '<img class="thumb" src="' + esc(p.imageUrl) + '" alt="">' : "") +
      "<p>" + esc(p.body) + "</p>" +
    "</article>" +
    '<p><a href="#/">&larr; Back to all posts</a></p>';
}

// ─────────── new post ───────────
function newView() {
  app.innerHTML =
    "<h2>New post</h2>" +
    '<form id="f">' +
      '<input id="title" placeholder="Title" required maxlength="140">' +
      '<textarea id="body" placeholder="Write something..." required></textarea>' +
      '<input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp">' +
      '<div id="preview"></div>' +
      '<button id="go" type="submit">Publish</button>' +
    "</form>" +
    '<p class="msg"></p>';

  const file = document.getElementById("file");
  file.onchange = function () {
    const f = file.files[0];
    document.getElementById("preview").innerHTML = f
      ? '<img class="thumb" src="' + URL.createObjectURL(f) + '" alt="preview">' : "";
  };

  document.getElementById("f").onsubmit = async function (e) {
    e.preventDefault();
    const msg = document.querySelector(".msg");
    const go = document.getElementById("go");
    msg.className = "msg"; msg.textContent = "";
    go.disabled = true; go.textContent = "Publishing...";

    try {
      let imageUrl = null;
      const f = file.files[0];

      if (f) {
        const b64 = await new Promise(function (ok, no) {
          const r = new FileReader();
          r.onload = function () { ok(String(r.result).split(",")[1]); };
          r.onerror = no;
          r.readAsDataURL(f);
        });
        const up = await api("/api/upload", {
          method: "POST",
          body: JSON.stringify({
            filename: f.name, contentType: f.type, data: b64, deviceId: deviceId()
          })
        });
        imageUrl = up.url;
      }

      await api("/api/posts", {
        method: "POST",
        body: JSON.stringify({
          title: document.getElementById("title").value,
          body: document.getElementById("body").value,
          imageUrl: imageUrl,
          deviceId: deviceId()
        })
      });

      location.hash = "#/";
    } catch (err) {
      msg.className = "msg err";
      msg.textContent = err.message;
      go.disabled = false; go.textContent = "Publish";
    }
  };
}

// ─────────── admin ───────────
async function adminView() {
  if (!keyStore.get()) {
    app.innerHTML =
      "<h2>Admin</h2>" +
      '<p class="muted">Enter the admin password.</p>' +
      '<form id="login">' +
        '<input id="key" type="password" placeholder="Admin password" required>' +
        '<button type="submit">Sign in</button>' +
      "</form>" +
      '<p class="err" id="e"></p>';

    document.getElementById("login").onsubmit = function (e) {
      e.preventDefault();
      keyStore.set(document.getElementById("key").value);
      adminView();
    };
    return;
  }

  let posts, mod;
  try {
    const both = await Promise.all([
      api("/api/posts", { admin: true }),
      api("/api/mod", { admin: true })
    ]);
    posts = both[0]; mod = both[1];
  } catch (e) {
    keyStore.clear();
    app.innerHTML = '<p class="err">' + esc(e.message) + "</p>" +
      '<p><a href="#/admin">Try again</a></p>';
    return;
  }

  const bans = (mod && mod.bans) || [];
  const blocked = {};
  bans.forEach(function (b) { blocked[b.bannedDevice] = true; });

  const postRows = posts.length ? posts.map(function (p) {
    return '<div class="row">' +
      "<h3>" + esc(p.title) + "</h3>" +
      '<div class="meta"><code>' + esc(String(p.deviceId).slice(0, 12)) + "</code> &middot; " +
        esc(p.ip) + " &middot; " + fmt(p.createdAt) +
        (blocked[p.deviceId] ? ' <span class="tag">BLOCKED</span>' : "") + "</div>" +
      '<div style="margin-top:6px">' +
        '<button class="small danger" data-del="' + esc(p.id) + '">Delete</button>' +
        (blocked[p.deviceId] ? "" :
          ' <button class="small danger" data-block="' + esc(p.deviceId) +
          '" data-ip="' + esc(p.ip) + '">Block device</button>') +
      "</div></div>";
  }).join("") : '<p class="muted">No posts.</p>';

  const banRows = bans.length ? bans.map(function (b) {
    return '<div class="row">' +
      '<div class="meta"><code>' + esc(String(b.bannedDevice).slice(0, 12)) + "</code> &middot; " +
        esc(b.ip) + " &middot; " + fmt(b.bannedAt) +
        (b.reason ? " &middot; " + esc(b.reason) : "") + "</div>" +
      '<div style="margin-top:6px">' +
        '<button class="small" data-unblock="' + esc(b.bannedDevice) + '">Unblock</button>' +
      "</div></div>";
  }).join("") : '<p class="muted">Nobody is blocked.</p>';

  app.innerHTML =
    "<h2>Admin</h2>" +
    '<p class="ok" id="msg"></p>' +
    '<h3 style="font-size:15px;margin:18px 0 4px">Posts (' + posts.length + ")</h3>" +
    postRows +
    '<h3 style="font-size:15px;margin:26px 0 4px">Blocked devices (' + bans.length + ")</h3>" +
    banRows +
    '<p style="margin-top:24px"><button class="small" id="out">Sign out</button></p>';

  document.getElementById("out").onclick = function () {
    keyStore.clear();
    adminView();
  };

  app.onclick = async function (e) {
    const b = e.target.closest("button");
    if (!b || !b.dataset) return;
    if (!b.dataset.del && !b.dataset.block && !b.dataset.unblock) return;

    const msg = document.getElementById("msg");
    b.disabled = true;
    try {
      if (b.dataset.del) {
        await api("/api/posts/" + encodeURIComponent(b.dataset.del),
          { method: "DELETE", admin: true });
      } else if (b.dataset.block) {
        const reason = prompt("Reason (optional):", "");
        if (reason === null) { b.disabled = false; return; }
        await api("/api/mod", {
          method: "POST", admin: true,
          body: JSON.stringify({
            action: "block", deviceId: b.dataset.block, ip: b.dataset.ip, reason: reason
          })
        });
      } else if (b.dataset.unblock) {
        await api("/api/mod", {
          method: "POST", admin: true,
          body: JSON.stringify({ action: "unblock", deviceId: b.dataset.unblock })
        });
      }
      adminView();
    } catch (err) {
      msg.className = "err";
      msg.textContent = err.message;
      b.disabled = false;
    }
  };
}

// ─────────── router ───────────
function router() {
  const h = location.hash || "#/";
  app.innerHTML = "Loading...";
  if (h.indexOf("#/post/") === 0) postView(h.slice(7));
  else if (h === "#/new") newView();
  else if (h === "#/admin") adminView();
  else listView();
}

window.addEventListener("hashchange", router);
router();
</script>
</body>
</html>
