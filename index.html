<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <style>
    body { font-family: Georgia, serif; max-width: 620px; margin: 40px auto; padding: 0 16px; color: #222; line-height: 1.6; }
    header { border-bottom: 2px solid #222; padding-bottom: 8px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: baseline; }
    header h1 { margin: 0; font-size: 28px; }
    header h1 a { color: #222; text-decoration: none; }
    header a { font-size: 14px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    article { border-bottom: 1px solid #ddd; padding: 16px 0; }
    article h3 { margin: 0 0 4px; font-size: 20px; }
    article h3 a { color: #222; }
    .meta { color: #888; font-size: 13px; margin-bottom: 8px; }
    .thumb { max-width: 100%; height: auto; border: 1px solid #ddd; margin: 8px 0; display: block; }
    input, textarea, button { width: 100%; box-sizing: border-box; font: inherit; padding: 8px; margin-bottom: 8px; }
    textarea { min-height: 140px; }
    form button { background: #222; color: #fff; border: 0; cursor: pointer; }
    form button:disabled { background: #999; cursor: default; }
    a { color: #1558a8; }
    .err { color: #b00020; }
    .hint { color: #888; font-size: 13px; }
    label.file { display: block; font-size: 14px; color: #555; margin-bottom: 4px; }
  </style>
</head>
<body>
  <header>
    <h1><a href="#/">My Blog</a></h1>
    <span id="auth"></span>
  </header>

  <div id="app">Loading...</div>

  <script>
    const app = document.getElementById("app");

    function fmt(d) {
      return new Date(d).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
    }

    function img(url, cls) {
      return url ? `<img class="${cls || 'thumb'}" src="${url}" alt="">` : "";
    }

    async function renderList() {
      const posts = await (await fetch("/api/posts")).json();
      if (!posts.length) {
        app.innerHTML = "<p>No posts yet. <a href='#/new'>Write the first one.</a></p>";
        return;
      }
      app.innerHTML = posts.map(p => `
        <article>
          <h3><a href="#/post/${p.id}">${p.title}</a></h3>
          <div class="meta">${p.author} &middot; ${fmt(p.createdAt)}</div>
          ${img(p.imageUrl)}
          <p>${p.body.length > 110 ? p.body.slice(0, 110) + "..." : p.body}</p>
        </article>`).join("");
    }

    async function renderPost(id) {
      const res = await fetch("/api/posts/" + id);
      if (!res.ok) {
        app.innerHTML = "<p>Post not found.</p><a href='#/'>&larr; Back to all posts</a>";
        return;
      }
      const p = await res.json();
      app.innerHTML = `
        <article style="border:0">
          <h3 style="font-size:24px">${p.title}</h3>
          <div class="meta">${p.author} &middot; ${fmt(p.createdAt)}</div>
          ${img(p.imageUrl)}
          <p>${p.body}</p>
        </article>
        <a href="#/">&larr; Back to all posts</a>`;
    }

    function renderNew() {
      app.innerHTML = `
        <h2>New post</h2>
        <form id="form">
          <input id="title" placeholder="Title" required>
          <textarea id="body" placeholder="Write something..." required></textarea>
          <label class="file">Image (optional, max 5 MB)</label>
          <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
          <div id="preview"></div>
          <button type="submit" id="submit">Publish</button>
        </form>
        <p class="err" id="err"></p>`;

      const fileInput = document.getElementById("file");

      fileInput.onchange = () => {
        const f = fileInput.files[0];
        document.getElementById("preview").innerHTML = "";
        if (!f) return;
        const url = URL.createObjectURL(f);
        document.getElementById("preview").innerHTML = `<img class="thumb" src="${url}" alt="preview">`;
      };

      document.getElementById("form").onsubmit = async e => {
        e.preventDefault();
        const err = document.getElementById("err");
        const btn = document.getElementById("submit");
        err.textContent = "";
        btn.disabled = true;
        btn.textContent = "Publishing...";

        try {
          let imageUrl = null;
          const f = fileInput.files[0];

          if (f) {
            const base64 = await new Promise((resolve, reject) => {
              const r = new FileReader();
              r.onload = () => resolve(String(r.result).split(",")[1]);
              r.onerror = reject;
              r.readAsDataURL(f);
            });

            const up = await fetch("/api/upload", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ filename: f.name, contentType: f.type, data: base64 })
            });
            const upBody = await up.json();
            if (!up.ok) throw new Error(upBody.error || "Image upload failed");
            imageUrl = upBody.url;
          }

          const res = await fetch("/api/posts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              title: document.getElementById("title").value,
              body: document.getElementById("body").value,
              author: "Amir",
              imageUrl
            })
          });

          if (!res.ok) {
            const b = await res.json();
            throw new Error(b.error || "Could not save the post");
          }

          location.hash = "#/";
        } catch (ex) {
          err.textContent = ex.message;
          btn.disabled = false;
          btn.textContent = "Publish";
        }
      };
    }

    let user = null;
    let isAdmin = false;

    async function loadUser() {
      try {
        const r = await fetch("/.auth/me");
        const d = await r.json();
        user = d && d.clientPrincipal ? d.clientPrincipal : null;
      } catch {
        user = null;
      }
      if (user) {
        try {
          const probe = await fetch("/api/admin/bans");
          isAdmin = probe.ok;
        } catch {
          isAdmin = false;
        }
      }
      const auth = document.getElementById("auth");
      if (user) {
        const adminLink = isAdmin ? ` &nbsp; <a href="/admin">Admin</a>` : "";
        auth.innerHTML = `<a href="#/new">+ New post</a>${adminLink} &nbsp; <a href="/.auth/logout">Sign out</a>`;
      } else {
        auth.innerHTML = `<a href="/.auth/login/github?post_login_redirect_uri=/">Sign in to publish</a>`;
      }
    }

    function router() {
      const h = location.hash || "#/";
      app.innerHTML = "Loading...";
      if (h.indexOf("#/post/") === 0) renderPost(h.slice(7));
      else if (h === "#/new") {
        if (!user) {
          app.innerHTML = `<p>Sign in to publish a post.</p>
            <p><a href="/.auth/login/github?post_login_redirect_uri=/#/new">Sign in with GitHub</a></p>`;
        } else {
          renderNew();
        }
      }
      else renderList();
    }

    window.addEventListener("hashchange", router);

    (async () => {
      await loadUser();
      router();
    })();
  </script>
</body>
</html>
